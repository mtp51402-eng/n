<!DOCTYPE html>
<html lang="ml">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07181c">
<meta name="mobile-web-app-capable" content="yes">

<title>CV – അറബി പഠന ഗെയിം</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Naskh+Arabic:wght@500;700&family=Noto+Sans+Malayalam:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#07181c;--gold:#ffd166;--gold2:#f4a300;--glass:rgba(255,255,255,.07);--line:rgba(255,255,255,.13);--green:#2ecc71;--red:#ff5a5f;--tx:#f5fbfa;--mut:#9cc3bf;--g2:#17a398}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--tx);font-family:"Noto Sans Malayalam",system-ui,sans-serif;user-select:none;-webkit-user-select:none;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;transform:translateZ(0);background:radial-gradient(800px 480px at 8% -8%,#0f7a7b 0,transparent 62%),radial-gradient(640px 460px at 108% 6%,#4b34d6 0,transparent 58%),linear-gradient(#07181c,#0a2227)}
button{touch-action:manipulation}
[hidden]{display:none!important}
.screen{display:none;max-width:560px;margin:0 auto;padding:14px 14px 48px}
.screen.on{display:block;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.top{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:10px}
.hero{display:flex;align-items:center;justify-content:space-between;padding:6px 2px 12px}
.logo{font-size:42px;font-weight:800;letter-spacing:3px;line-height:1;background:linear-gradient(135deg,#fff3b0,#ffd166 50%,#f4a300);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{font-size:22px;color:var(--mut);margin-top:2px}
.prog{display:flex;align-items:center;gap:10px;margin-bottom:14px}
.pbar{flex:1;height:8px;border-radius:8px;background:rgba(255,255,255,.1);overflow:hidden}
.pbar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--g2),var(--gold));border-radius:8px;transition:width .5s}
.prog span{font-size:12px;color:var(--mut);white-space:nowrap}
.ico{background:var(--glass);border:1px solid var(--line);color:var(--tx);width:46px;height:46px;border-radius:15px;font-size:22px;cursor:pointer}
.card{background:var(--glass);border:1px solid var(--line);border-radius:22px;padding:16px;margin-bottom:14px}
label{display:block;font-size:13px;color:var(--mut);margin:8px 0 4px}
.pw{position:relative}.pw input{padding-right:52px}
.eye{position:absolute;right:6px;top:50%;transform:translateY(-50%);width:40px;height:40px;border:0;border-radius:10px;background:transparent;color:var(--tx);font-size:20px;cursor:pointer}
input[type=text],input[type=password],input:not([type]){width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--line);background:rgba(255,255,255,.06);color:var(--tx);font-size:17px;font-family:inherit;user-select:text;-webkit-user-select:text}
input:focus{outline:0;border-color:var(--gold)}
.btn{display:block;width:100%;padding:15px;border-radius:16px;border:1px solid var(--line);background:var(--glass);color:var(--tx);font-size:17px;font-weight:600;font-family:inherit;margin-top:10px;cursor:pointer;transition:transform .08s}
.btn:active{transform:scale(.97)}
.btn.gold{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2a00;border:0;box-shadow:0 6px 18px rgba(244,163,0,.25)}
.btn.ghost{background:transparent;border:1.5px solid rgba(255,255,255,.25)}
.btn.sm{display:inline-block;width:auto;padding:8px 16px;font-size:14px;margin-top:10px;border-radius:12px}
.lvgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}
.lvgrid:empty{display:none}
.lv{display:flex;align-items:center;gap:10px;text-align:left;padding:10px 12px;min-height:64px;border-radius:18px;border:1px solid var(--line);background:var(--glass);color:var(--tx);font-family:inherit;cursor:pointer}
.lv:last-child:nth-child(odd){grid-column:1/-1}
.lv b{flex:none;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:rgba(255,255,255,.1);font-size:17px}
.lv span{font-size:14px;font-weight:600;line-height:1.3}
.lv.cur{background:linear-gradient(135deg,rgba(255,209,102,.22),rgba(244,163,0,.08));border-color:rgba(255,209,102,.55)}
.lv.cur b{background:linear-gradient(135deg,var(--gold),var(--gold2));color:#3a2a00}
.lv.dn b{background:rgba(46,204,113,.28);color:#9df3c1}
.lv.op b{background:rgba(125,150,255,.28)}
.lv.lock{opacity:.4;cursor:not-allowed}
#lvt{font-weight:800;font-size:18px}
#tm{font-size:14px;color:var(--gold);min-width:60px;text-align:center}
.dots{display:flex;gap:8px;justify-content:center;margin:4px 0}
.dots i{width:16px;height:16px;border-radius:50%;background:rgba(255,255,255,.15);transition:background .25s}
.dots i.on{background:var(--green);box-shadow:0 0 10px var(--green)}
.cnt{text-align:center;font-size:12px;color:var(--mut);margin-bottom:10px}
#prompt{text-align:center}
.ml{font-size:19px;font-weight:600;line-height:1.5}
.ar{font-family:"Noto Naskh Arabic","Amiri","Traditional Arabic",serif}
.big{font-size:60px;line-height:1.6;color:var(--gold)}
.tiles{display:flex;gap:10px;justify-content:center;direction:rtl;flex-wrap:wrap}
.tile{background:rgba(255,255,255,.07);border-radius:14px;padding:4px 16px;font-size:44px;line-height:1.7;border:2px solid transparent}
.tile.hl{border-color:var(--gold);background:rgba(255,209,102,.18)}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.row{display:flex;flex-direction:row-reverse;flex-wrap:wrap;justify-content:center}
.opt{border:1.5px solid var(--line);background:linear-gradient(160deg,rgba(255,255,255,.13),rgba(255,255,255,.05));color:var(--tx);border-radius:20px;min-height:78px;padding:6px 10px;font-size:20px;cursor:pointer;transition:background .12s,transform .08s;font-family:inherit}
.opt.ar{font-family:"Noto Naskh Arabic","Amiri",serif;font-size:42px;line-height:1.7}
.opt:active{transform:scale(.96)}
.opt.ok,.tile.ok,.gap.ok{background:var(--green)!important;color:#fff;border-color:#9df3c1;animation:pop .3s}
.opt.bad,.tile.bad,.gap.bad{background:var(--red)!important;color:#fff;border-color:#ffb3b5;animation:shake .3s}
.opt.sel,.tile.sel{border-color:var(--gold);background:rgba(255,209,102,.25)}
@keyframes pop{50%{transform:scale(1.07)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.multi{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.multi .opt{min-height:70px;font-size:38px;padding:0}
.gaprow{display:flex;direction:rtl;justify-content:center;align-items:center;flex-wrap:wrap;gap:4px;margin-top:6px}
.gap{width:38px;height:70px;border-radius:12px;border:2px dashed var(--gold);background:rgba(255,209,102,.1);color:#fff;font-size:34px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gaprow .tile{font-size:40px;padding:2px 8px}
@media(max-width:430px){.gaprow .tile{font-size:32px;padding:2px 4px}.gap{width:26px;height:58px}}
.acts{display:flex;gap:10px;margin-top:6px}
.acts .btn{margin-top:8px}
.dwrap{position:relative;margin:6px auto;border-radius:20px;background:rgba(0,0,0,.3);border:2px solid var(--line);overflow:hidden;touch-action:none}
.dwrap canvas{position:absolute;left:0;top:0;touch-action:none}
.dwrap.ok{border-color:var(--green)}
.dwrap.bad{border-color:var(--red)}
.mask{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:center;justify-content:center;z-index:9;padding:18px}
.mask.on{display:flex}
.box{background:#0f3036;border:1px solid var(--line);border-radius:24px;padding:22px;width:100%;max-width:420px;text-align:center;max-height:90vh;overflow:auto;animation:pop .35s}
.box h2{margin:0 0 10px}
.grow{display:grid;grid-template-columns:44px 1fr 74px;align-items:center;gap:8px;padding:7px 4px;border-bottom:1px solid var(--line);text-align:left}
.grow .ar{font-size:32px;line-height:1.2;text-align:center}.grow small{display:block;color:var(--mut);font-size:12px;line-height:1.3}
.grow .ex{font-size:30px;text-align:center}.grow .no{color:#ff8a80;font-size:13px;text-align:center}
.gnote{font-size:13px;color:var(--mut);text-align:left;margin:8px 0}
.row3{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.07);border-radius:14px;padding:10px 12px;margin:8px 0;text-align:left}
.row3 b{font-size:26px}.row3 span{flex:1;font-weight:600}.row3 em{font-style:normal;color:var(--gold)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#000d;padding:10px 16px;border-radius:12px;font-size:14px;display:none;z-index:40;max-width:90%;text-align:center}
#cert{width:100%;border-radius:12px;background:#fff;box-shadow:0 8px 24px #0006}
.chk{display:flex;align-items:center;gap:8px;margin:12px 0;font-size:16px}
.chk input{width:22px;height:22px}
#mum{position:fixed;inset:0;z-index:30;display:none;flex-direction:column;align-items:center;justify-content:center;background:rgba(4,14,18,.84)}
#mum.on{display:flex}
#mum .mt{font-size:min(30vw,150px);line-height:1.6;background:linear-gradient(180deg,#fff3b0,#ffd166 45%,#f4a300);-webkit-background-clip:text;background-clip:text;color:transparent;animation:mpop .7s cubic-bezier(.2,1.4,.4,1) both}
#mum .ms{font-size:20px;font-weight:700;color:var(--tx);animation:fade .6s .35s both}
#fx{position:fixed;inset:0;width:100%;height:100%;z-index:31;pointer-events:none}
@keyframes mpop{from{transform:scale(.2) rotate(-8deg);opacity:0}to{transform:none;opacity:1}}
</style>
</head>
<body><div id="netb" style="display:none;position:fixed;top:0;left:0;right:0;z-index:99;background:#b8820a;color:#fff;text-align:center;font-size:12px;padding:3px">📴 ഓഫ്‌ലൈൻ: സ്കോർ ഫോണിൽ സൂക്ഷിക്കും, നെറ്റ് വന്നാൽ ലീഡർബോർഡിൽ ചേരും</div>

<section id="home" class="screen on">
  <div class="hero"><div><div class="logo">CV</div><div class="sub ar">تَعَلَّمِ الْعَرَبِيَّة</div></div><button class="ico" id="trophyBtn" title="Leaderboard">🏆</button></div>
  <div class="prog"><div class="pbar"><i id="pfill"></i></div><span id="ptxt"></span></div>
  <div class="card">
    <label>കോഡ്</label>
    <div class="pw"><input id="code" type="password" placeholder="കോഡ് നൽകുക" autocapitalize="characters" autocomplete="new-password" spellcheck="false"><button type="button" class="eye" id="eye" aria-label="കോഡ് കാണിക്കുക/മറയ്ക്കുക">👁</button></div>

  <button class="btn ghost" id="cont" hidden></button>
  <button class="btn" id="install" hidden>📲 ഫോണിൽ ഇൻസ്റ്റാൾ ചെയ്യുക</button>

</section>

<section id="game" class="screen">
  <div class="top"><button class="ico" id="back">←</button><div id="lvt"></div><div id="tm"></div><button class="ico" id="trophy2">🏆</button></div>
  <div class="dots" id="dots"></div>
  <div class="cnt" id="cnt"></div>
  <div id="prompt" class="card"></div>
  <div id="ans"></div>

<section id="fin" class="screen">
  <div class="top"><button class="ico" id="finHome">⌂</button><div id="lvt2" style="font-weight:800">🎉 അഭിനന്ദനങ്ങൾ!</div><span style="width:44px"></span></div>
  <div class="card">
    <label>സർട്ടിഫിക്കറ്റിലെ പേര്</label>
    <input id="certName" type="text" placeholder="നിങ്ങളുടെ പേര്" autocomplete="off">
    <label>സർട്ടിഫിക്കറ്റ് ശൈലി</label>
    <div style="display:flex;gap:8px;margin-bottom:8px"><button class="btn sm" id="stM" type="button">✨ മോഡേൺ</button><button class="btn sm ghost" id="stC" type="button">📜 ക്ലാസിക്</button></div>

  </div>

  <button class="btn" id="wa" style="background:#25d366;color:#052">🟢 WhatsApp ൽ ഷെയർ ചെയ്യുക</button>
  <button class="btn ghost" id="finBoard">🏆 ലീഡർബോർഡ്</button>
</section>

<div id="mum"><div class="mt ar">مُمْتَاز</div><div class="ms">ലെവൽ പൂർത്തിയായി!</div></div>
<canvas id="fx"></canvas>
<div class="mask" id="mask"><div class="box" id="box"></div></div>
<div id="toast"></div>

<script>
/* ================= CONFIG =================
 DB_URL: എല്ലാ ഫോണുകളിലും ഒരേ ലീഡർബോർഡ് കാണാൻ ഒരു Firebase Realtime Database URL നൽകുക
 (ഉദാ: "https://your-project-default-rtdb.firebaseio.com"; rules ൽ read/write ഓൺ ആക്കണം).
 ഒഴിച്ചിട്ടാൽ ലീഡർബോർഡ് ഈ ഫോണിൽ മാത്രം (localStorage) സേവ് ആകും. */
const CFG={DB_URL:"https://cv-game-fa1cb-default-rtdb.asia-southeast1.firebasedatabase.app",MASTER_H:559811118399194};
function h53(s,seed=0){let h1=0xdeadbeef^seed,h2=0x41c6ce57^seed;for(let i=0;i<s.length;i++){const ch=s.charCodeAt(i);h1=Math.imul(h1^ch,2654435761);h2=Math.imul(h2^ch,1597334677)}h1=Math.imul(h1^(h1>>>16),2246822507)^Math.imul(h2^(h2>>>13),3266489909);h2=Math.imul(h2^(h2>>>16),2246822507)^Math.imul(h1^(h1>>>13),3266489909);return 4294967296*(2097151&h2)+(h1>>>0)}
const normCode=c=>String(c||'').trim().replace(/\s+/g,' ').toUpperCase();
const ck=c=>'k'+h53(normCode(c)).toString(36);
let MASTER=false;try{MASTER=localStorage.getItem('cv_master')==='1'}catch(e){}
function fetchT(u,o,ms=7000){const c=new AbortController(),t=setTimeout(()=>c.abort(),ms);return fetch(u,{...o,signal:c.signal}).finally(()=>clearTimeout(t))}

const $=s=>document.querySelector(s);
const el=(t,c)=>{const e=document.createElement(t);if(c)e.className=c;return e};
const rnd=n=>Math.floor(Math.random()*n);
const shuf=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=rnd(i+1);[a[i],a[j]]=[a[j],a[i]]}return a};
const pick=(a,n=1)=>shuf(a).slice(0,n);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=s=>{s=Math.round(s);return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')};
function toast(t){const e=$('#toast');e.textContent=t;e.style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>e.style.display='none',3500)}

/* ================= DATA ================= */
const FA='\u064E',KA='\u0650',DA='\u064F',SU='\u0652',SH='\u0651';
const LET=[["ا","അലിഫ്","ألف"],["ب","ബാ","باء"],["ت","താ","تاء"],["ث","ഥാ","ثاء"],["ج","ജീം","جيم"],["ح","ഹാ","حاء","തൊണ്ടയുടെ നടുഭാഗത്ത് നിന്ന്"],["خ","ഖാ","خاء"],["د","ദാൽ","دال"],["ذ","ദാൽ","ذال","നാവിൽ നിന്നും വരുന്ന മൃദുവായ ദാൽ"],["ر","റാ","راء"],["ز","സാ (സായ്)","زاي"],["س","സീൻ","سين"],["ش","ഷീൻ","شين"],["ص","സ്വാദ്","صاد"],["ض","ള്വാദ്","ضاد"],["ط","ത്വാ","طاء"],["ظ","ള്വാ","ظاء"],["ع","ഐൻ","عين"],["غ","ഗൈൻ","غين"],["ف","ഫാ","فاء"],["ق","ഖാഫ്","قاف"],["ك","കാഫ്","كاف"],["ل","ലാം","لام"],["م","മീം","ميم"],["ن","നൂൻ","نون"],["ه","ഹാ","هاء","തൊണ്ടയുടെ അടിഭാഗത്ത് നിന്നുള്ളത്"],["و","വാവ്","واو"],["ي","യാ","ياء"]];
const NOJOIN='ادذرزو'; // ശേഷം വരുന്ന അക്ഷരത്തോട് ചേർത്ത് എഴുതാൻ പറ്റാത്തവ (❌)
const BASE=LET.slice(1);
const HN={[FA]:'ഫത്ഹ്',[KA]:'കസ്‌റ്',[DA]:'ദമ്മ്',[SU]:'സുകൂൻ'};
const U3=[['ب','ബ'],['ت','ത'],['ج','ജ'],['د','ദ'],['ر','ര'],['ش','ശ'],['ف','ഫ'],['ك','ക'],['ل','ല'],['م','മ'],['ن','ന'],['ه','ഹ'],['س','സ'],['ط','ട']];
const MSIGN={[FA]:'',[KA]:'ി',[DA]:'ു'};
const SIM={ب:'تثن',ت:'بثن',ث:'تبس',ج:'حخ',ح:'جخ',خ:'حج',د:'ذر',ذ:'دز',ر:'زد',ز:'رذ',س:'شص',ش:'سص',ص:'ضس',ض:'صط',ط:'ظض',ظ:'طض',ع:'غ',غ:'ع',ف:'ق',ق:'فك',ك:'لق',ل:'كن',م:'نه',ن:'مب',ه:'ح',و:'ر',ي:'ن',ا:'ل'};
const CL=s=>s.match(/[\u0621-\u064A][\u064B-\u0652]*/g)||[];

// ലെവൽ 5 – രണ്ടക്ഷര വാക്കുകൾ (അർത്ഥമുള്ളതും ഇല്ലാത്തതും)

const SUKUN = '\u0652'; // സുക്കൂൻ (ْ)
const DAMMA = '\u064F'; // ളംമ് (ُ)

function parseArabicClusters(text) {
  const clean = (text || '').replace(/\s+/g, '').replace(/\u200D/g, '');
  const clusters = [];
  for (const ch of clean) {
    if (HARAKAT_MARKS.test(ch)) {
      if (clusters.length > 0) {
        clusters[clusters.length - 1].marks.push(ch);
      } else {
        clusters.push({ base: '', marks: [ch] });
      }
    } else {
      clusters.push({ base: ch, marks: [] });
    }
  }
  return clusters;
}

// ഹറക്കത്ത് കർശനമായി പരിശോധിക്കുന്ന ഫംഗ്ഷൻ (ഹറക്കത്ത് ഇല്ലെങ്കിൽ Wrong)
function validateStrictHarakat(userInput, expectedWord, options = {}) {
  const { requireFinalMark = null } = options; // 'sukun' അല്ലെങ്കിൽ 'damma'
  const userClusters = parseArabicClusters(userInput);
  const expectedClusters = parseArabicClusters(expectedWord);

  // ഹറക്കത്ത് ഒട്ടും ഇല്ലെങ്കിൽ തെറ്റ്
  const hasAnyHarakat = userClusters.some(c => c.marks.length > 0);
  if (!hasAnyHarakat) {
    return { ok: false, msg: 'ഹറക്കത്ത് നിർബന്ധമാണ്! ഹറക്കത്തില്ലാതെ ശരിയാകില്ല.' };
  }

  if (userClusters.length !== expectedClusters.length) {
    return { ok: false, msg: 'അക്ഷരങ്ങളുടെ എണ്ണം ശരിയല്ല.' };
  }

  for (let i = 0; i < expectedClusters.length; i++) {
    const exp = expectedClusters[i];
    const usr = userClusters[i];
    const isLast = i === expectedClusters.length - 1;

    if (usr.base !== exp.base) {
      return { ok: false, msg: ${i + 1}-ാമത്തെ അക്ഷരം ശരിയല്ല. };
    }

    const expMarks = [...exp.marks].sort().join('');
    const usrMarks = [...usr.marks].sort().join('');

    if (isLast && requireFinalMark === 'sukun' && !usr.marks.includes(SUKUN)) {
      return { ok: false, msg: 'അവസാന അക്ഷരത്തിൽ സുക്കൂൻ (ْ) തന്നെ വേണം.' };
    }
    if (isLast && requireFinalMark === 'damma' && !usr.marks.includes(DAMMA)) {
      return { ok: false, msg: 'അവസാന അക്ഷരത്തിൽ ളംമ് (ُ) തന്നെ വേണം.' };
    }

    if (usrMarks !== expMarks) {
      return { ok: false, msg: ${usr.base} എന്ന അക്ഷരത്തിലെ ഹറക്കത്ത് ശരിയല്ല. };
    }
  }

  return { ok: true, msg: 'കൃത്യം!' };
}

  else{G.streak=0;if(!G.wq.includes(q))G.wq.push(q);G.since=0}

  G.since++;
  if(!G.practice)P.ls={streak:G.streak,correct:G.correct,asked:G.asked,best:G.best,seen:[...G.seen]};
  save();hud();

const GS=32,ZW='‍',ZN='‌',MARKS_RE=/[ً-ْ]/g;
function dil(g,r){const o=new Uint8Array(GS*GS);for(let y=0;y<GS;y++)for(let x=0;x<GS;x++)if(g[y*GS+x])for(let dy=-r;dy<=r;dy++)for(let dx=-r;dx<=r;dx++){const yy=y+dy,xx=x+dx;if(yy>=0&&yy<GS&&xx>=0&&xx<GS)o[yy*GS+xx]=1}return o}
// ഒരു ഭാഗത്തെ (x0..x1) മഷിയെ അക്ഷരശരീരം (body) / ചെറിയ അടയാളങ്ങൾ (പുള്ളി, ഹറക്കത്ത്) എന്നിങ്ങനെ വേർതിരിക്കുന്നു
function inkComps(data,W,H,x0,x1){
  x0=Math.max(0,x0|0);x1=Math.min(W,x1|0);
  const m=new Uint8Array(W*H),dl=new Uint8Array(W*H);let n=0,ax0=1e9,ay0=1e9,ax1=-1,ay1=-1;
  for(let y=0;y<H;y++)for(let x=x0;x<x1;x++)if(data[(y*W+x)*4+3]>40){m[y*W+x]=1;n++;if(x<ax0)ax0=x;if(x>ax1)ax1=x;if(y<ay0)ay0=y;if(y>ay1)ay1=y}
  if(n<30)return null;
  const R=2;
  for(let y=0;y<H;y++)for(let x=x0;x<x1;x++)if(m[y*W+x])for(let dy=-R;dy<=R;dy++){const yy=y+dy;if(yy<0||yy>=H)continue;for(let dx=-R;dx<=R;dx++){const xx=x+dx;if(xx>=x0&&xx<x1)dl[yy*W+xx]=1}}
  const seen=new Uint8Array(W*H),comps=[];
  for(let y=0;y<H;y++)for(let x=x0;x<x1;x++){
    const p=y*W+x;if(!dl[p]||seen[p])continue;
    const st=[p];seen[p]=1;const k={a:0,x0:1e9,x1:-1,y0:1e9,y1:-1,sy:0,px:[]};
    while(st.length){const q=st.pop(),qy=(q/W)|0,qx=q-qy*W;
      if(m[q]){k.a++;k.sy+=qy;k.px.push(q);if(qx<k.x0)k.x0=qx;if(qx>k.x1)k.x1=qx;if(qy<k.y0)k.y0=qy;if(qy>k.y1)k.y1=qy}
      for(let dy=-1;dy<=1;dy++)for(let dx=-1;dx<=1;dx++){const nx=qx+dx,ny=qy+dy;if(nx<x0||nx>=x1||ny<0||ny>=H)continue;const k2=ny*W+nx;if(dl[k2]&&!seen[k2]){seen[k2]=1;st.push(k2)}}}
    if(k.a)comps.push(k);
  }
  return{comps,W,H,big:Math.max(ax1-ax0+1,ay1-ay0+1)};
}
function shapeInfo(data,W,H,x0,x1){
  const ic=inkComps(data,W,H,x0,x1);if(!ic)return null;
  const{comps,big}=ic;
  const ext=c=>Math.max(c.x1-c.x0+1,c.y1-c.y0+1);
  const mx=comps.reduce((a,c)=>c.a>a.a?c:a,comps[0]);
  let body=comps.filter(c=>c===mx||ext(c)>=.5*ext(mx)||c.a>=.35*mx.a);
  const nm=comps.length-body.length;
  let bx0=1e9,by0=1e9,bx1=-1,by1=-1;body.forEach(c=>{bx0=Math.min(bx0,c.x0);bx1=Math.max(bx1,c.x1);by0=Math.min(by0,c.y0);by1=Math.max(by1,c.y1)});
  const bw=bx1-bx0+1,bh=by1-by0+1,g=new Uint8Array(GS*GS);let n=0;
  body.forEach(c=>c.px.forEach(q=>{const y=(q/W)|0,x=q-y*W;g[Math.min(GS-1,((y-by0)*GS/bh)|0)*GS+Math.min(GS-1,((x-bx0)*GS/bw)|0)]=1;n++}));
  return{g,n,asp:bw/bh,nm};
}
function shapeScore(u,t,dr=2){
  if(!u||!t||u.n<30)return 0;
  const r=u.asp/t.asp;if(r<.4||r>2.5)return 0;
  const da=dil(u.g,dr),db=dil(t.g,dr);let ca=0,cb=0,cov=0,pre=0;
  for(let i=0;i<GS*GS;i++){if(u.g[i]){ca++;if(db[i])pre++}if(t.g[i]){cb++;if(da[i])cov++}}
  return Math.min(cov/cb,pre/ca);
}
// ടെംപ്ലേറ്റ് ചിത്രം: ഒരു ടെക്സ്റ്റ് (ഒറ്റ വാക്ക്/അക്ഷരം) ഒരു കള്ളിയിൽ വരച്ച് shapeInfo എടുക്കുന്നു
const _tc={};
function tmplInfo(txt){
  if(_tc[txt])return _tc[txt];
  const W=240,H=170,c=mk(W,H),x=c.getContext('2d');x.fillStyle='#000';paintCell(x,W,H,1,0,txt);
  return _tc[txt]=shapeInfo(x.getImageData(0,0,W,H).data,W,H,0,W);
}
const stripH=t=>t.replace(MARKS_RE,'');
try{document.fonts.addEventListener('loadingdone',()=>{for(const k in _tc)delete _tc[k]})}catch(e){}
// ഒരു അക്ഷരം ഓരോ രൂപത്തിൽ: ഒറ്റയ്ക്ക് / തുടക്കം / നടുവ് / അവസാനം
const FORMS={iso:[ZN,ZN],ini:[ZN,ZW],med:[ZW,ZW],fin:[ZW,ZN]};
function formStr(parts,i,f){return parts.map((x,j)=>j===i?FORMS[f][0]+x+FORMS[f][1]:x).join('')}
// രൂപങ്ങൾ തമ്മിൽ വ്യത്യാസമുള്ള ഭാഗം മാത്രം നോക്കുന്നു: കുട്ടി എഴുതിയത് ശരിയായ രൂപത്തിന്റെ ഭാഗത്താണോ, മറ്റേ (തെറ്റായ) രൂപത്തിന്റെ ഭാഗത്താണോ കൂടുതൽ?
function diffScore(u,good,t,r){
  const dg=dil(good.g,r),dt=dil(t.g,r),du=dil(u.g,r);let go=0,vo=0,gc=0,vc=0;
  for(let i=0;i<GS*GS;i++){
    if(good.g[i]&&!dt[i]){go++;if(du[i])gc++}
    if(t.g[i]&&!dg[i]){vo++;if(du[i])vc++}
  }
  if(go<10||vo<10)return null;
  return{a:gc/go,b:vc/vo};
}
function compete(u,good,others,th=.25,bmin=.45){
  const sg=shapeScore(u,good);let worst=-9,bk=null;
  others.forEach(([k,t])=>{const d=diffScore(u,good,t,1);if(d&&d.b>bmin&&d.b-d.a>worst){worst=d.b-d.a;bk=k}});
  return{sg,bk:worst>th?bk:null};
}
function dedupe(good,list){return list.filter(([k,t])=>shapeScore(t,good)<.92)}

const ISO_TH=.2,ISO_B=.35;
const ASP_LO=.58,ASP_HI=1.75,XSIM={ي:'بتثنقى',ن:'بيق',ق:'نفو',ج:'حخع',ح:'جخع',خ:'جحغ',ع:'غجح',غ:'عخ',س:'شصمن',ش:'سصض',ك:'ل',ل:'كا',م:'ه',ه:'مو'};
// ലെവൽ 10: ഓരോ കള്ളിയിലും ഒറ്റയ്ക്കുള്ള രൂപം
function checkIsolated(u,W,H,cells){
  const N=cells.length;let why='';
  for(let i=0;i<N;i++){
    const x0=W-(i+1)*W/N,x1=W-i*W/N,gu=shapeInfo(u,W,H,x0,x1);
    if(!gu||gu.n<60){return{ok:false,msg:'ഓരോ കള്ളിയിലും അക്ഷരം എഴുതണം'}}
    const base=cells[i];
    const iso=tmplInfo(base);
    const others=dedupe(iso,['ini','med','fin'].map(f=>[f,tmplInfo(f==='ini'?base+ZW:f==='med'?ZW+base+ZW:ZW+base)]));
    const r=compete(gu,iso,others,ISO_TH,ISO_B);
    if(r.sg<.25)return{ok:false,msg:'ഒറ്റയ്ക്കുള്ള അക്ഷരരൂപം പൊരുത്തപ്പെടുന്നില്ല'};
    // വലുപ്പ അനുപാതം ശരിയായ ഒറ്റ രൂപത്തോട് അടുത്തായിരിക്കണം (ഉദാ: വാലുള്ള ഒറ്റ "യാ" അല്ലാതെ വെറും കപ്പ് രൂപം തള്ളും)
    const ar=gu.asp/iso.asp;
    if(ar<ASP_LO||ar>ASP_HI)return{ok:false,msg:'ഒറ്റയ്ക്കുള്ള അക്ഷരത്തിന്റെ ആകൃതി/വാല് ശരിയായില്ല. ഒറ്റയ്ക്ക് വരുമ്പോഴുള്ള പൂർണ്ണ രൂപത്തിൽ എഴുതുക'};
    // സമാന രൂപമുള്ള മറ്റ് അക്ഷരത്തോടാണോ കൂടുതൽ ചേരുന്നത്
    const cf=[...new Set((SIM[base[0]]||'')+(XSIM[base[0]]||''))].filter(c=>!(base[0]==='ب'&&c==='ن')).map(c=>[c,tmplInfo(c)]).filter(([c,t])=>t&&shapeScore(t,iso)<.7);
    const cr=compete(gu,iso,cf,.3,.5);
    if(cr.bk)return{ok:false,msg:`ഇത് "${cr.bk}" പോലെയാണ് തോന്നുന്നത്, "${base[0]}" അല്ല. ശരിയായ ഒറ്റ രൂപത്തിൽ എഴുതുക`};
    if(r.bk)return{ok:false,msg:'ഇത് വാക്കിൽ ചേർന്നുവരുന്ന രൂപമാണ്; ഒറ്റയ്ക്ക് എഴുതുമ്പോഴുള്ള (ചേർക്കാത്ത) രൂപത്തിൽ എഴുതുക'};
  }
  return{ok:true,msg:''};
}
// ലെവൽ 9: ചേർത്തെഴുത്ത് – ചേരേണ്ടവ ചേർന്നോ, ഓരോ ഭാഗത്തും അക്ഷരരൂപം (തുടക്കം/നടുവ്/അവസാനം) ശരിയാണോ
const DOTS={'ب':[0,1],'ت':[2,0],'ث':[3,0],'ج':[0,1],'خ':[1,0],'ذ':[1,0],'ز':[1,0],'ش':[3,0],'ض':[1,0],'ظ':[1,0],'غ':[1,0],'ف':[1,0],'ق':[2,0],'ن':[1,0],'ي':[0,2],'ة':[2,0]};
// ചേർത്തെഴുത്ത് പരിശോധന: ഫോണ്ട് രൂപത്തോട് ഒത്തുനോക്കൽ കൈയെഴുത്തിൽ വിശ്വസനീയമല്ല, അതുകൊണ്ട് ഘടന നോക്കുന്നു:
// 1) ചേരേണ്ടവ ചേർന്നോ / ചേരരുതാത്തവ വേർപെട്ടോ (ഭാഗങ്ങളുടെ എണ്ണം)  2) പുള്ളികൾ മുകളിലും താഴെയും ശരിയായ എണ്ണം  3) ഭാഗങ്ങളുടെ വീതിയുടെ അനുപാതം
function checkJoined(u,W,H,cl,groups){
  const ic=inkComps(u,W,H,0,W);if(!ic||ic.comps.reduce((a,c)=>a+c.a,0)<60)return{ok:false,msg:'വളരെ കുറച്ച് മാത്രമേ എഴുതിയുള്ളൂ'};
  const big=ic.big,ext=c=>Math.max(c.x1-c.x0+1,c.y1-c.y0+1);
  const body=ic.comps.filter(c=>ext(c)>=.25*big),marks=ic.comps.filter(c=>ext(c)<.25*big);
  if(body.length>groups.length)return{ok:false,msg:`ചേരേണ്ട അക്ഷരങ്ങൾ ചേർന്നിട്ടില്ല. ${groups.length} ഭാഗങ്ങളായി എഴുതിയാൽ മതി, നിങ്ങൾ ${body.length} ഭാഗങ്ങളായാണ് എഴുതിയത്. (ا د ذ ر ز و എന്നിവയ്ക്ക് ശേഷം മാത്രം ഗ്യാപ്പ്)`};
  if(body.length<groups.length)return{ok:false,msg:`ا د ذ ر ز و എന്നിവ ശേഷമുള്ള അക്ഷരത്തോട് ചേരില്ല. അവയ്ക്ക് ശേഷം ഗ്യാപ്പ് ഇടുക (${groups.length} ഭാഗം വേണം)`};
  let cyy=0,cn=0;body.forEach(c=>{cyy+=c.sy;cn+=c.a});const cy=cyy/cn;let up=0,lo=0;
  marks.forEach(c=>{const w=c.x1-c.x0+1,h=c.y1-c.y0+1,fill=c.a/(w*h);
    if(Math.max(w,h)<=40&&Math.min(w,h)<=18&&fill>=.4){const n=Math.max(1,Math.round((Math.max(w,h)+6)/16));if(c.sy/c.a<cy)up+=n;else lo+=n}});
  const ed=cl.reduce((a,x)=>{const d=DOTS[x[0]]||[0,0];return[a[0]+d[0],a[1]+d[1]]},[0,0]);
  if(Math.abs(up-ed[0])>1||Math.abs(lo-ed[1])>1||Math.abs(up+lo-ed[0]-ed[1])>1)
    return{ok:false,msg:`പുള്ളികൾ ശരിയല്ല: ഈ വാക്കിൽ മുകളിൽ ${ed[0]}, താഴെ ${ed[1]} പുള്ളി വേണം (നിങ്ങളുടേത് മുകളിൽ ${up}, താഴെ ${lo})`};
  if(body.length>1){
    const ctx=cl.map((x,i)=>(i>0&&!NOJ.includes(cl[i-1][0])?'\u200D':'')+x+(i<cl.length-1&&!NOJ.includes(x[0])?'\u200D':'')).join('');
    const tc=mk(W,H),tx=tc.getContext('2d');tx.fillStyle='#f5c542';paintCell(tx,W,H,1,0,ctx);
    const ti=inkComps(tx.getImageData(0,0,W,H).data,W,H,0,W);
    if(ti){const tb=ti.comps.filter(c=>ext(c)>=.25*ti.big).sort((a,b)=>(b.x0+b.x1)-(a.x0+a.x1));
      const ub=body.slice().sort((a,b)=>(b.x0+b.x1)-(a.x0+a.x1));
      if(tb.length===ub.length){const tw=tb.reduce((a,c)=>a+c.x1-c.x0+1,0),uw=ub.reduce((a,c)=>a+c.x1-c.x0+1,0);let dev=0;
        tb.forEach((c,i)=>{dev=Math.max(dev,Math.abs((c.x1-c.x0+1)/tw-(ub[i].x1-ub[i].x0+1)/uw))});
        if(dev>.2)return{ok:false,msg:'ഭാഗങ്ങളുടെ വലുപ്പം ശരിയല്ല: ഓരോ ഭാഗത്തിലും ശരിയായ എണ്ണം അക്ഷരങ്ങൾ എഴുതുക'}}}
  }
  return{ok:true,msg:''};
}

R.draw=(q,A)=>{
  const N=q.cells.length,W=Math.min(A.clientWidth||340,520),H=N===1?200:170;
  const wrap=el('div','dwrap');wrap.style.cssText=`width:${W}px;height:${H}px`;
  const gc=mk(W,H),dc=mk(W,H);wrap.append(gc,dc);A.appendChild(wrap);
  const g=gc.getContext('2d'),d=dc.getContext('2d');
  const ghost=(col,al)=>{g.clearRect(0,0,W,H);g.strokeStyle='rgba(255,255,255,.25)';g.setLineDash([6,6]);
    for(let i=1;i<N;i++){g.beginPath();g.moveTo(W*i/N,10);g.lineTo(W*i/N,H-10);g.stroke()}g.setLineDash([]);
    if(col){g.fillStyle=col;g.globalAlpha=al;q.cells.forEach((t,i)=>paintCell(g,W,H,N,i,t));g.globalAlpha=1}};
  ghost();
  let dr=false,lx=0,ly=0,any=false;
  const pos=e=>{const r=dc.getBoundingClientRect();return[(e.clientX-r.left)*W/r.width,(e.clientY-r.top)*H/r.height]};
  dc.onpointerdown=e=>{if(G.lock)return;dr=true;dc.setPointerCapture(e.pointerId);[lx,ly]=pos(e);d.fillStyle='#f5c542';d.beginPath();d.arc(lx,ly,5,0,7);d.fill();any=true};
  dc.onpointermove=e=>{if(!dr)return;const[x,y]=pos(e);d.strokeStyle='#f5c542';d.lineWidth=10;d.lineCap='round';d.beginPath();d.moveTo(lx,ly);d.lineTo(x,y);d.stroke();lx=x;ly=y};
  dc.onpointerup=dc.onpointercancel=()=>dr=false;
  const acts=$('#acts');
  const bc=el('button','btn');bc.textContent='🗑 മായ്ക്കുക';bc.onclick=()=>{if(G.lock)return;d.clearRect(0,0,W,H);any=false;wrap.classList.remove('bad','ok');ghost();};
  const bk=el('button','btn gold');bk.textContent='✔ പരിശോധിക്കുക';
  bk.onclick=()=>{
    if(G.lock)return;if(!any){toast('ആദ്യം എഴുതുക');return}G.lock=1;
    const u=d.getImageData(0,0,W,H).data;let ok=true,why='';
    const r=q.groups?checkJoined(u,W,H,q.cl,q.groups):checkIsolated(u,W,H,q.cells);ok=r.ok;why=r.msg;
    if(!ok&&why)toast(why);
    wrap.classList.add(ok?'ok':'bad');if(!ok)ghost('#22c55e',.6);
    finishQ(ok);
  };
  acts.append(bc,bk);
};

let AC=null;
function ac(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(e){}return AC}
['pointerdown','touchstart','keydown'].forEach(ev=>addEventListener(ev,()=>ac(),{passive:true}));
function winSound(){const a=ac();if(!a)return;const t0=a.currentTime+.02;
  [[523.25,0],[659.25,.12],[783.99,.24],[1046.5,.38],[1046.5,.58],[1318.5,.58],[1568,.58]].forEach(([f,d],i)=>{
    const o=a.createOscillator(),g=a.createGain();o.type=i>2?'triangle':'sine';o.frequency.value=f;
    g.gain.setValueAtTime(0,t0+d);g.gain.linearRampToValueAtTime(.22,t0+d+.02);g.gain.exponentialRampToValueAtTime(.001,t0+d+(d>.5?1.1:.45));
    o.connect(g);g.connect(a.destination);o.start(t0+d);o.stop(t0+d+1.2)})}
let fxRaf=0;
function confetti(ms){
  const c=$('#fx'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#ffd166','#ff5a5f','#2ecc71','#4cc9f0','#b388ff','#ff9f1c','#ffffff'],W=c.width,H=c.height,P2=[];
  for(let i=0;i<120;i++){const an=-Math.PI/2+(Math.random()-.5)*2.4,sp=6+Math.random()*10;
    P2.push({x:W/2,y:H*.4,vx:Math.cos(an)*sp,vy:Math.sin(an)*sp,s:5+Math.random()*7,r:Math.random()*6,vr:(Math.random()-.5)*.4,c:cols[i%cols.length]})}
  const t0=performance.now();cancelAnimationFrame(fxRaf);
  const f=t=>{const e=t-t0;x.clearRect(0,0,W,H);
    P2.forEach(p=>{p.vy+=.28;p.vx*=.995;p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.globalAlpha=Math.max(0,1-e/ms);x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});
    if(e<ms)fxRaf=requestAnimationFrame(f);else x.clearRect(0,0,W,H)};
  fxRaf=requestAnimationFrame(f);
}

let CERT_STYLE='modern';try{CERT_STYLE=localStorage.getItem('cv_cs')||'modern'}catch(e){}
function setCS(s){CERT_STYLE=s;try{localStorage.setItem('cv_cs',s)}catch(e){}$('#stM').classList.toggle('ghost',s!=='modern');$('#stC').classList.toggle('ghost',s!=='classic');drawCert()}
$('#stM').onclick=()=>setCS('modern');$('#stC').onclick=()=>setCS('classic');
function drawCert(){
  $('#stM').classList.toggle('ghost',CERT_STYLE!=='modern');$('#stC').classList.toggle('ghost',CERT_STYLE!=='classic');
  if(CERT_STYLE==='modern')return drawCertModern();
  drawCertClassic();
}
function drawCertClassic(){
  const c=$('#cert'),W=1200,H=850;c.width=W;c.height=H;const x=c.getContext('2d');
  const name=$('#certName').value.trim()||'Your Name';
  const g=x.createLinearGradient(0,0,W,H);g.addColorStop(0,'#fffdf2');g.addColorStop(1,'#fdf0c8');x.fillStyle=g;x.fillRect(0,0,W,H);
  x.strokeStyle='#0f5a5c';x.lineWidth=14;x.strokeRect(30,30,W-60,H-60);x.strokeStyle='#d9a21b';x.lineWidth=4;x.strokeRect(54,54,W-108,H-108);
  x.textAlign='center';x.fillStyle='#0f5a5c';
  x.font='800 74px "Noto Sans Malayalam",serif';x.fillText('Certificate of Completion',W/2,190);
  x.font='500 34px "Noto Sans Malayalam",sans-serif';x.fillStyle='#555';x.fillText('This is to certify that',W/2,270);
  x.fillStyle='#b8820a';let fs=96;x.font=`800 ${fs}px "Noto Sans Malayalam",serif`;while(x.measureText(name).width>W-260&&fs>30){fs-=4;x.font=`800 ${fs}px "Noto Sans Malayalam",serif`}
  x.fillText(name,W/2,400);x.fillRect(220,425,W-440,3);
  x.fillStyle='#333';x.font='500 36px "Noto Sans Malayalam",sans-serif';
  x.fillText('has successfully completed all 12 levels of',W/2,500);
  x.font='800 44px "Noto Sans Malayalam",sans-serif';x.fillStyle='#0f5a5c';x.fillText('CV – Arabic Learning Game',W/2,565);
  x.font='600 36px "Noto Sans Malayalam",sans-serif';x.fillStyle='#333';
  x.fillText(`Points: ${P.points}`+(S.mode==='comp'?`   |   Time: ${fmt(P.time)}`:''),W/2,640);
  if(S.mode==='comp'&&P.rank&&!$('#hideRank').checked){x.font='800 52px "Noto Sans Malayalam",sans-serif';x.fillStyle='#b8820a';x.fillText('🏆 '+rankTxt(P.rank),W/2,720)}
  x.font='400 26px "Noto Sans Malayalam",sans-serif';x.fillStyle='#777';x.fillText(new Date().toLocaleDateString('en-GB'),W/2,775);
}

function star8(x,cx,cy,r){x.beginPath();for(let i=0;i<16;i++){const a=Math.PI/8*i-Math.PI/2,rr=i%2?r*.58:r;x.lineTo(cx+rr*Math.cos(a),cy+rr*Math.sin(a))}x.closePath()}
function drawCertModern(){
  const c=$('#cert'),W=1200,H=850;c.width=W;c.height=H;const x=c.getContext('2d');
  const name=$('#certName').value.trim()||'Your Name';
  const F='"Noto Sans Malayalam","Inter",system-ui,sans-serif';
  const sp=v=>{try{x.letterSpacing=v}catch(e){}};
  // background
  x.fillStyle='#fbfaf4';x.fillRect(0,0,W,H);
  // left band with star pattern
  const BW=300,g=x.createLinearGradient(0,0,BW,H);g.addColorStop(0,'#0a3f42');g.addColorStop(1,'#0f6a66');x.fillStyle=g;x.fillRect(0,0,BW,H);
  x.save();x.beginPath();x.rect(0,0,BW,H);x.clip();x.strokeStyle='rgba(255,255,255,.10)';x.lineWidth=2;
  for(let r=0;r<9;r++)for(let q=0;q<4;q++){star8(x,(q+(r%2?.5:0))*100+30,r*100+20,44);x.stroke()}
  x.restore();
  x.fillStyle='#e0b13a';x.fillRect(BW,0,8,H);
  // medal
  const mx=150,my=300;
  const mg=x.createRadialGradient(mx-20,my-30,10,mx,my,100);mg.addColorStop(0,'#fff0b0');mg.addColorStop(.5,'#e8b93c');mg.addColorStop(1,'#b7861a');
  x.fillStyle='rgba(0,0,0,.25)';x.beginPath();x.arc(mx+4,my+8,98,0,7);x.fill();
  x.fillStyle=mg;x.beginPath();x.arc(mx,my,98,0,7);x.fill();
  x.strokeStyle='#fff3c4';x.lineWidth=4;x.beginPath();x.arc(mx,my,84,0,7);x.stroke();
  x.fillStyle='#0a3f42';x.textAlign='center';x.font=`800 78px ${F}`;sp('0px');x.fillText('12',mx,my+14);
  x.font=`700 20px ${F}`;sp('4px');x.fillText('LEVELS',mx,my+46);
  x.fillStyle='#fff';x.font=`700 26px ${F}`;sp('3px');x.fillText('CV',mx,540);
  x.font=`500 18px ${F}`;sp('2px');x.fillStyle='rgba(255,255,255,.75)';x.fillText('ARABIC',mx,568);x.fillText('LEARNING GAME',mx,592);
  x.font='700 56px "Noto Naskh Arabic",serif';sp('0px');x.fillStyle='#f3d27a';x.fillText('مُمْتَاز',mx,720);
  // main content
  const L=360,R=W-70,CX=(L+R)/2;
  x.strokeStyle='rgba(224,177,58,.55)';x.lineWidth=3;x.strokeRect(L-30,40,R-L+60,H-80);
  x.textAlign='center';
  x.fillStyle='#b7861a';x.font=`700 24px ${F}`;sp('10px');x.fillText('CERTIFICATE',CX,128);
  x.fillStyle='#0a3f42';x.font=`800 76px ${F}`;sp('0px');x.fillText('of Completion',CX,215);
  x.fillStyle='#e0b13a';x.fillRect(CX-60,245,120,5);
  x.fillStyle='#667';x.font=`500 27px ${F}`;x.fillText('This certificate is proudly presented to',CX,315);
  let fs=92;x.fillStyle='#0b2f33';x.font=`800 ${fs}px ${F}`;while(x.measureText(name).width>R-L-40&&fs>34){fs-=4;x.font=`800 ${fs}px ${F}`}
  x.fillText(name,CX,420);
  const nw=Math.min(R-L-40,Math.max(300,x.measureText(name).width+60));x.fillStyle='#e0b13a';x.fillRect(CX-nw/2,446,nw,3);
  x.fillStyle='#555';x.font=`500 29px ${F}`;x.fillText('for successfully completing all 12 levels of',CX,508);
  x.fillStyle='#0f6a66';x.font=`800 42px ${F}`;x.fillText('CV – Arabic Learning Game',CX,562);
  // chips
  const chips=[['POINTS',String(P.points)]];
  if(S.mode==='comp'){chips.push(['TIME',fmt(P.time)]);if(P.rank&&!$('#hideRank').checked)chips.push(['RANK',rankTxt(P.rank).replace(' Rank','')])}
  else chips.push(['LEVELS','12 / 12']);
  const cw=190,ch=104,gap=24,tot=chips.length*cw+(chips.length-1)*gap;let cx0=CX-tot/2;
  chips.forEach(([k,v])=>{
    x.fillStyle='#fff';x.shadowColor='rgba(10,63,66,.18)';x.shadowBlur=16;x.shadowOffsetY=5;
    x.beginPath();x.roundRect(cx0,610,cw,ch,18);x.fill();x.shadowColor='transparent';x.shadowBlur=0;x.shadowOffsetY=0;
    x.fillStyle='#e0b13a';x.fillRect(cx0+18,610+14,28,4);
    x.fillStyle='#889';x.font=`700 17px ${F}`;sp('4px');x.fillText(k,cx0+cw/2,610+44);
    x.fillStyle='#0a3f42';x.font=`800 38px ${F}`;sp('0px');x.fillText(v,cx0+cw/2,610+88);
    cx0+=cw+gap});
  // footer
  const d=new Date(),ds=d.toLocaleDateString('en-GB');
  let h=0;const sd=name+ds+P.points;for(let i=0;i<sd.length;i++)h=(h*31+sd.charCodeAt(i))>>>0;
  x.textAlign='left';x.fillStyle='#889';x.font=`500 21px ${F}`;sp('1px');x.fillText('Date: '+ds,L,790);
  x.textAlign='right';x.fillText('No. CV-'+h.toString(36).toUpperCase().padStart(6,'0').slice(0,6),R,790);
}
function certBlob(){return new Promise(r=>$('#cert').toBlob(r,'image/png'))}
$('#dl').onclick=async()=>{const b=await certBlob(),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='CV-Certificate.png';a.click()};
$('#wa').onclick=async()=>{
  const name=$('#certName').value.trim()||'ഞാൻ';
  const rk=(S.mode==='comp'&&P.rank&&!$('#hideRank').checked)?` · ${rankTxt(P.rank)}`:'';
  const text=`🏆 ${name} "CV – അറബി പഠന ഗെയിം" പൂർത്തിയാക്കി!\n⭐ പോയിന്റ്: ${P.points}${rk}`;
  try{const b=await certBlob(),f=new File([b],'CV-Certificate.png',{type:'image/png'});
    if(navigator.canShare&&navigator.canShare({files:[f]})){await navigator.share({files:[f],text});return}}catch(e){if(e&&e.name==='AbortError')return}
  window.open('https://wa.me/?text='+encodeURIComponent(text),'_blank');
};
